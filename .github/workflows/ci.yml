name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: web (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run build
        working-directory: web

  python:
    name: python (import + collect)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -r agent/requirements.txt
          pip install -r api/requirements.txt
          pip install -r evals/requirements.txt
      - name: Import agent and API modules
        run: |
          PYTHONPATH=agent/src python -c "import agent, medinfo_agent, deck, prompts, audit, telemetry, rpc"
          PYTHONPATH=api/src python -c "import main"
      - name: API smoke test
        run: |
          PYTHONPATH=api/src python - <<'PY'
          from fastapi.testclient import TestClient
          import main
          c = TestClient(main.app)
          assert c.get("/health").json()["status"] == "ok"
          deck = c.get("/api/deck/metformin").json()
          assert len(deck["slides"]) == 6, deck
          assert c.get("/api/deck/nope").status_code == 404
          print("api smoke ok")
          PY
      - name: Collect evals
        run: python -m pytest --collect-only -q

  evals:
    name: evals (navigation + guardrails)
    runs-on: ubuntu-latest
    # Billable. Runs only when an API key is configured, and never blocks a PR
    # from a fork (which has no access to secrets).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r agent/requirements.txt -r evals/requirements.txt
      - name: Run LLM evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Cheaper model for CI; the README numbers come from a local run on
          # whatever LLM_MODEL is configured there.
          EVAL_LLM_MODEL: ${{ vars.EVAL_LLM_MODEL || 'claude-haiku-4-5' }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY not configured - LLM evals skipped"
            exit 0
          fi
          python -m pytest evals/test_navigation.py evals/test_guardrails.py -q -s
